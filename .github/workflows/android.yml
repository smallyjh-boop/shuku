# 打包并发布书库的新版本：NAS 服务器镜像（发到 ghcr.io）、安卓 App、Wear OS 手表 App、浏览器插件。
# 只能手动运行：GitHub 仓库页面 → Actions → “打包 App 和插件” → Run workflow。平时推送代码不会打包。
#
# 在线升级：手机 App、手表 App、插件的安装包和服务器打在同一个镜像里。镜像推到
# ghcr.io/smallyjh-boop/shuku:latest 后，NAS 上的更新服务（taihaoshuo-updater，Watchtower）一分钟内自动换上，
# 各端再从书库检查到新版本。所以每次都全部打包（大约 6 分钟）。
#
# 运行环境（Debian + Calibre 等转换工具，几百 MB）单独做成基础镜像 ghcr.io/smallyjh-boop/shuku-base，
# Dockerfile 里 base 那一段没改就一直用同一个：每次升级 NAS 只下载程序、网页和安装包这几十 MB。
#
# 为了省 Actions 分钟数和存储：只有一个任务；只打 x86 版（NAS 是 Intel 处理器）；不建缓存、不上传 Artifacts；
# ghcr.io 上只留最近 10 个版本（新版本有问题时可以退回 :v旧版本号）；超过 35 分钟自动停止。
#
# 版本号：填的版本号（或 android/gradle.properties 里的）后面接第几次打包，比如 1.0.0.12。各端都按它判断新旧。
#
# 签名：默认用仓库里的 android/signing/shuku.jks。想换成自己的签名，在仓库
# Settings → Secrets and variables → Actions 里添加：
#   SHUKU_KEYSTORE_BASE64（签名文件 base64 -w0 之后的内容）、SHUKU_KEYSTORE_PASSWORD、SHUKU_KEY_ALIAS、SHUKU_KEY_PASSWORD
# 手机和手表必须用同一个签名，换签名后两个都要重新安装。
name: 打包 App 和插件

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，只用数字和点，最多三段，比如 1.1 或 1.0.1（留空就用 android/gradle.properties 里的）
        type: string
        default: ""
      rebuild_base:
        description: 重新制作基础镜像（Debian 和 Calibre 更新到最新，NAS 要多下载几百 MB；平时不用勾）
        type: boolean
        default: false
      rebuild_dict:
        description: 重新生成本地字典（拿最新的 CC-CEDICT，NAS 要多下载几十 MB；平时不用勾）
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

# 连点两次也只打包一次
concurrency:
  group: shuku-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smallyjh-boop/shuku
  BASE_IMAGE: ghcr.io/smallyjh-boop/shuku-base
  RUNTIME_IMAGE: ghcr.io/smallyjh-boop/shuku-runtime
  # 本地字典的数据（固定版本）：重编国语辞典修订本（CC BY-ND 3.0 TW）、ECDICT（MIT）、CC-CEDICT（CC BY-SA 4.0，每天更新，取当时最新的）
  MOEDICT_URL: https://raw.githubusercontent.com/g0v/moedict-data/a6dc997417507eb510fc29822bc514de2c92728c/dict-revised.json.xz
  ECDICT_URL: https://raw.githubusercontent.com/skywind3000/ECDICT/bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b/ecdict.csv
  CEDICT_URL: https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz

jobs:
  build:
    runs-on: ubuntu-24.04  # 固定系统版本：ubuntu-latest 2026-10-19 起换成 Ubuntu 26，避免打包环境突然变化
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: 版本号
        env:
          INPUT_V: ${{ inputs.version }}
        run: |
          V="$INPUT_V"
          [ -n "$V" ] || V=$(grep '^shuku.versionName=' android/gradle.properties | cut -d= -f2)
          if ! echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::版本号只能用数字和点，最多三段，比如 1.0.1：$V"
            exit 1
          fi
          N=${{ github.run_number }}
          FULL="$V.$N"
          # 内部版本号每次递增，新包可以直接覆盖安装旧包；各端都按完整版本号判断有没有新版本
          sed -i "s/^shuku.versionCode=.*/shuku.versionCode=$N/" android/gradle.properties
          sed -i "s/^shuku.versionName=.*/shuku.versionName=$FULL/" android/gradle.properties
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$FULL\"/" extension/manifest.json
          grep '^shuku.version' android/gradle.properties
          grep '"version"' extension/manifest.json
          echo "V=$FULL" >> "$GITHUB_ENV"
          echo "N=$N" >> "$GITHUB_ENV"
          mkdir -p dist "$RUNNER_TEMP/ctx/out/clients"

      # ---------- 手机、手表 App 和浏览器插件 ----------

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.SHUKU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shuku.jks"
            echo "SHUKU_KEYSTORE_FILE=$RUNNER_TEMP/shuku.jks" >> "$GITHUB_ENV"
            echo "使用 Secrets 里的签名"
          else
            echo "没有设置 SHUKU_KEYSTORE_BASE64，使用仓库里的 android/signing/shuku.jks"
          fi

      - name: 打包手机和手表 APK
        working-directory: android
        env:
          SHUKU_KEYSTORE_PASSWORD: ${{ secrets.SHUKU_KEYSTORE_PASSWORD }}
          SHUKU_KEY_ALIAS: ${{ secrets.SHUKU_KEY_ALIAS }}
          SHUKU_KEY_PASSWORD: ${{ secrets.SHUKU_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          # 两个 App 在一次 Gradle 里并行打包；不开守护进程、不建缓存
          ./gradlew --no-daemon --parallel --console=plain --stacktrace \
            :app:assembleRelease :wear:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk ../dist/shuku-android.apk
          cp wear/build/outputs/apk/release/wear-release.apk ../dist/shuku-wear.apk

      - name: 打包浏览器插件
        run: |
          cd extension
          zip -r -X -q ../dist/shuku-extension.zip . -x '.*'

      - name: 各端安装包放进服务器镜像
        run: |
          C="$RUNNER_TEMP/ctx/out/clients"
          cp dist/shuku-android.apk dist/shuku-wear.apk dist/shuku-extension.zip "$C/"
          python3 - "$C" <<'EOF'
          import hashlib, json, os, sys
          c, v, n = sys.argv[1], os.environ["V"], int(os.environ["N"])
          def info(name, **kw):
              p = os.path.join(c, name)
              return {"file": name, "size": os.path.getsize(p), "sha256": hashlib.sha256(open(p, "rb").read()).hexdigest(), **kw}
          data = {
              "version": v,
              "android": info("shuku-android.apk", versionCode=n, versionName=v),
              "wear": info("shuku-wear.apk", versionCode=100000 + n, versionName=v),
              "extension": info("shuku-extension.zip", version=v),
          }
          json.dump(data, open(os.path.join(c, "clients.json"), "w"), ensure_ascii=False, indent=1)
          print(json.dumps(data, ensure_ascii=False, indent=1))
          EOF

      # ---------- NAS 服务器镜像 ----------

      - name: 编译 NAS 服务器（先跑自动测试）
        run: |
          set -o pipefail
          # 在和运行环境同样的 Debian bookworm 里编译（glibc 一致）。
          # 先跑测试（数据库升级、家人账号、回收站、扫描、备份恢复等），没通过就不打包；
          # 测试和编译用同样的参数，SQLite 只编译一次
          docker run --rm -e V="$V" -v "$PWD/server:/src" -v "$RUNNER_TEMP/ctx:/ctx" -w /src golang:1.24-bookworm \
            sh -ec 'export CGO_ENABLED=1
              go vet -mod=vendor -tags sqlite_fts5 .
              if go test -mod=vendor -tags sqlite_fts5 -trimpath -count=1 -v . > /tmp/test.log 2>&1; then
                grep -E "^(--- |ok|PASS)" /tmp/test.log | grep -v "^--- PASS" || true; echo "自动测试：$(grep -c "^--- PASS" /tmp/test.log) 项通过"
              else
                grep -v "数据库已升级" /tmp/test.log | tail -n 120; echo "自动测试没通过"; exit 1
              fi
              go build -mod=vendor -tags sqlite_fts5 -trimpath -ldflags "-s -w -X main.version=$V" -o /ctx/out/shuku .' \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"
          file "$RUNNER_TEMP/ctx/out/shuku"

      - name: 基础镜像（Debian 和 Calibre 等转换工具，没改就用做好的）
        env:
          REBUILD: ${{ inputs.rebuild_base }}
        run: |
          set -o pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # 标签按 Dockerfile 里 base 那一段的内容算：那一段没改，就一直用同一个基础镜像
          tag=$(awk '/^FROM .* AS base$/ {f=1; print; next} /^FROM / {f=0} f' Dockerfile | sha256sum | cut -c1-12)
          B="$BASE_IMAGE:$tag"
          echo "BASE=$B" >> "$GITHUB_ENV"
          if [ "$REBUILD" != "true" ] && docker buildx imagetools inspect "$B" > /dev/null 2>&1; then
            echo "用已有的基础镜像 $B"
          else
            echo "制作基础镜像 $B"
            docker buildx build --platform linux/amd64 --target base -t "$B" --load . 2>&1 | tee -a "$RUNNER_TEMP/build.log"
            docker push "$B"
          fi

      - name: 运行环境（基础镜像加上本地字典，没改就用做好的）
        env:
          REBUILD: ${{ inputs.rebuild_dict }}
        run: |
          set -o pipefail
          # 标签按基础镜像、Dockerfile 里 runtime 那一段、字典数据的地址和转换程序算：都没变就一直用同一个
          key="$BASE|$(awk '/^FROM .* AS runtime$/ {f=1; print; next} /^FROM / {f=0} f' Dockerfile)|$MOEDICT_URL|$ECDICT_URL|$CEDICT_URL|$(sha256sum server/dict_build.go | cut -c1-64)"
          tag=$(printf '%s' "$key" | sha256sum | cut -c1-12)
          R="$RUNTIME_IMAGE:$tag"
          echo "RUNTIME=$R" >> "$GITHUB_ENV"
          if [ "$REBUILD" != "true" ] && docker buildx imagetools inspect "$R" > /dev/null 2>&1; then
            echo "用已有的运行环境 $R"
            exit 0
          fi
          echo "生成本地字典，制作运行环境 $R"
          D="$RUNNER_TEMP/dictsrc"
          mkdir -p "$D" "$RUNNER_TEMP/ctx/out/dict"
          curl -fsSL --retry 3 "$MOEDICT_URL" | xz -d > "$D/moe.json"
          curl -fsSL --retry 3 "$ECDICT_URL" -o "$D/ecdict.csv"
          cedict=""
          if curl -fsSL --retry 3 "$CEDICT_URL" | gunzip > "$D/cedict.txt" && [ -s "$D/cedict.txt" ]; then
            cedict="-cedict $D/cedict.txt"
          else
            # 不带 CC-CEDICT 的字典不能用正式标签保存，否则以后一直用这个缺了一块的：换个标签，下次打包会重新下载
            R="$R-nocedict"
            echo "RUNTIME=$R" >> "$GITHUB_ENV"
            echo "::warning::CC-CEDICT 下载失败，这次的字典里没有大陆拼音和繁简对照（下次打包会再试）"
          fi
          ls -l "$D"
          "$RUNNER_TEMP/ctx/out/shuku" -build-dict "$RUNNER_TEMP/ctx/out/dict/dict.db" -moe "$D/moe.json" -ecdict "$D/ecdict.csv" $cedict 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          ls -l "$RUNNER_TEMP/ctx/out/dict"
          docker buildx build --platform linux/amd64 --target runtime --build-context base="docker-image://$BASE" --build-context build="$RUNNER_TEMP/ctx" \
            -t "$R" --load . 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          docker push "$R"

      - name: 文字识别（运行环境加上 tesseract，没改就用做好的）
        run: |
          set -o pipefail
          # 标签按运行环境和 Dockerfile 里 ocr 那一段算：都没变就一直用同一个。放在字典层后面，加它 NAS 不用重新下载字典
          key="$RUNTIME|$(awk '/^FROM .* AS ocr$/ {f=1; print; next} /^FROM / {f=0} f' Dockerfile)"
          O="$RUNTIME_IMAGE:ocr-$(printf '%s' "$key" | sha256sum | cut -c1-12)"
          echo "OCR=$O" >> "$GITHUB_ENV"
          if docker buildx imagetools inspect "$O" > /dev/null 2>&1; then
            echo "用已有的 $O"
            exit 0
          fi
          echo "制作 $O"
          docker buildx build --platform linux/amd64 --target ocr --build-context runtime="docker-image://$RUNTIME" \
            -t "$O" --load . 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          docker push "$O"

      - name: 取上一版镜像（试运行时测试从上一版升级）
        continue-on-error: true
        run: |
          if docker pull -q "$IMAGE:latest"; then
            docker tag "$IMAGE:latest" shuku-prev:latest
            docker image inspect shuku-prev:latest --format '上一版镜像：{{.Created}}'
          else
            echo "::warning::取不到上一版镜像，这次不测升级"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22' # 构建兼容旧系统的网页；旧浏览器检查要用 Node 22 自带的 WebSocket

      - name: 兼容旧系统的网页（墨水屏阅读器、旧安卓自带的网页组件用）
        run: |
          set -o pipefail
          # 网页降级成旧浏览器认识的普通脚本和样式，放进 web/legacy（镜像里跟着网页一起），书库按浏览器版本自动选用
          cd tools/legacy
          npm ci --no-audit --no-fund 2>&1 | tail -n 3
          node build.mjs 2>&1 | grep -v -e '^ ' -e '^$' | tee -a "$RUNNER_TEMP/build.log"

      - name: 打包服务器镜像并试运行
        run: |
          set -o pipefail
          # 用根目录的 Dockerfile：编译阶段换成前面编译好的程序和各端安装包，运行环境换成做好的（带字典和文字识别）
          docker buildx build --platform linux/amd64 --build-context build="$RUNNER_TEMP/ctx" --build-context ocr="docker-image://$OCR" \
            -t "$IMAGE:latest" -t "$IMAGE:v$V" --load . 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          # 和 NAS 上一样用宿主机网络试运行：接口、网页、各端安装包都要能取到
          docker run -d --name shuku-test --network host -e SHUKU_PORT=18080 "$IMAGE:latest" > /dev/null
          ok=""
          for i in $(seq 1 60); do
            r=$(curl -fsS http://127.0.0.1:18080/api/ping 2>/dev/null || true)
            case "$r" in *'"shuku"'*) ok=1; break ;; esac
            sleep 1
          done
          echo "接口：$r"
          page=$(curl -fsS http://127.0.0.1:18080/ 2>/dev/null || true)
          case "$page" in *'<title>书库</title>'*) echo "网页：正常" ;; *) ok=""; echo "网页打不开" ;; esac
          curl -fsS http://127.0.0.1:18080/api/clients > "$RUNNER_TEMP/clients-check.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/clients-check.json" <<'EOF' || { ok=""; echo "版本信息不对"; }
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          print("版本信息：", json.dumps(d, ensure_ascii=False))
          v, n = os.environ["V"], int(os.environ["N"])
          assert d["server"] == v, "服务器版本"
          assert d["android"]["versionCode"] == n and d["android"]["url"] == "/dl/shuku-android.apk", "手机 App"
          assert d["wear"]["versionCode"] == 100000 + n and d["wear"]["url"] == "/dl/shuku-wear.apk", "手表 App"
          assert d["extension"]["version"] == v and d["extension"]["url"] == "/dl/shuku-extension.zip", "插件"
          EOF
          # 本地字典：设好密码，查一个中文词、一个英文词
          tok=$(curl -fsS -X POST http://127.0.0.1:18080/api/auth/setup -H 'Content-Type: application/json' -d '{"Password":"smoke-test-1","Device":"ci"}' 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
          for q in 觊觎 went; do
            curl -fsS -G -H "Authorization: Bearer $tok" --data-urlencode "q=$q" http://127.0.0.1:18080/api/dict > "$RUNNER_TEMP/dict-$q.json" 2>/dev/null || true
          done
          python3 - "$RUNNER_TEMP" <<'EOF' || { ok=""; echo "本地字典不对"; }
          import json, sys
          zh = json.load(open(sys.argv[1] + "/dict-觊觎.json"))
          en = json.load(open(sys.argv[1] + "/dict-went.json"))
          print("字典：", json.dumps(zh, ensure_ascii=False)[:400])
          print("字典：", json.dumps(en, ensure_ascii=False)[:300])
          w = zh["words"][0]
          assert zh["installed"] and w["pinyin"][0] == "jì yú" and "希望得到" in json.dumps(w, ensure_ascii=False), "中文"
          assert en["words"][0]["word"] == "go", "英文"
          EOF
          # 转换工具（Calibre、djvu、7z、PDF 封面）和本地字典都要在
          curl -fsS -H "Authorization: Bearer $tok" http://127.0.0.1:18080/api/settings > "$RUNNER_TEMP/settings-check.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/settings-check.json" <<'EOF' || { ok=""; echo "转换工具不全"; }
          import json, sys
          tools = json.load(open(sys.argv[1]))["tools"]
          print("转换工具：", tools)
          assert all(tools.values()), [k for k, v in tools.items() if not v]
          EOF
          # 扫描版 PDF 识别文字：放进一页图片 PDF，识别出上面的字
          curl -fsS -X POST -H "Authorization: Bearer $tok" --data-binary @server/testdata/scan-en.pdf "http://127.0.0.1:18080/api/upload?path=scan-en.pdf" > /dev/null 2>&1 || true
          python3 - "$tok" <<'EOF' || { ok=""; echo "文字识别不对"; }
          import json, sys, time, urllib.request
          tok = sys.argv[1]
          def get(p):
              r = urllib.request.Request("http://127.0.0.1:18080" + p, headers={"Authorization": "Bearer " + tok})
              return json.load(urllib.request.urlopen(r, timeout=180))
          fid = None
          for i in range(60):
              items = get("/api/books?limit=50")["items"]
              for b in items:
                  for f in get(f"/api/books/{b['id']}").get("files", []):
                      if f.get("format") == "pdf":
                          fid = f["id"]
              if fid:
                  break
              time.sleep(1)
          assert fid, "扫描版 PDF 没有入库"
          page = get(f"/api/files/{fid}/ocr/1")
          text = "\n".join(l["text"] for l in page["lines"])
          print("文字识别（%s）：" % page["lang"], text.replace("\n", " / "))
          assert "12345" in text, text
          EOF
          # 兼容旧系统的网页：文件在，网页文件清单默认不列（别的手机不用多下载），网页组件旧的 App 要的时候列出来
          curl -fsS http://127.0.0.1:18080/legacy/app.js -o "$RUNNER_TEMP/legacy-app.js" 2>/dev/null || true
          curl -fsS http://127.0.0.1:18080/api/assets -o "$RUNNER_TEMP/assets.json" 2>/dev/null || true
          curl -fsS "http://127.0.0.1:18080/api/assets?legacy=1" -o "$RUNNER_TEMP/assets-legacy.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP" <<'EOF' || { ok=""; echo "兼容旧系统的网页不对"; }
          import json, os, sys
          t = sys.argv[1]
          assert os.path.getsize(t + "/legacy-app.js") > 100000, "legacy/app.js"
          a = [f["p"] for f in json.load(open(t + "/assets.json"))["files"]]
          b = [f["p"] for f in json.load(open(t + "/assets-legacy.json"))["files"]]
          assert not any(p.startswith("/legacy/") for p in a), "默认清单里不该有 legacy"
          assert "/legacy/app.js" in b and "/legacy/pdf.worker.js" in b, "legacy=1 的清单"
          print("兼容旧系统的网页：正常（%d 个文件）" % sum(p.startswith("/legacy/") for p in b))
          EOF
          # 旧版 Chromium（Chrome 64，像墨案这类旧安卓自带的网页组件）打开书库：书架、EPUB、TXT、PDF、漫画都要能用；
          # 模拟书库 App（原生桥），按墨案 inkPad X 的屏幕（936x1248）走一遍，再换 6 寸、横屏等几种尺寸看书架和 EPUB，页面不能比屏幕宽。
          # 浏览器在 npm 的 chrome-aws-lambda 包里（brotli 压缩的 headless_shell），测试书由测试脚本现做、上传
          if ( cd "$RUNNER_TEMP" && npm pack -q chrome-aws-lambda@64.0.3264 > /dev/null 2>&1 && tar xzf chrome-aws-lambda-64.0.3264.tgz \
              && node -e "const z=require('zlib'),fs=require('fs');fs.writeFileSync('chromium64',z.brotliDecompressSync(fs.readFileSync('package/bin/chromium.br')));fs.chmodSync('chromium64',0o755)" ); then
            node tools/legacy/test-old-chrome.mjs "$RUNNER_TEMP/chromium64" http://127.0.0.1:18080 "$tok" "$RUNNER_TEMP/old-chrome" --samples --app 2>&1 | tee -a "$RUNNER_TEMP/build.log" \
              || { ok=""; echo "旧版浏览器打不开书库"; }
          else
            echo "::warning::取不到旧版 Chromium，这次不测旧浏览器"
          fi
          for f in shuku-android.apk shuku-wear.apk shuku-extension.zip; do
            curl -fsS http://127.0.0.1:18080/dl/$f -o "$RUNNER_TEMP/dl-$f" 2>/dev/null || true
            cmp -s "$RUNNER_TEMP/dl-$f" "dist/$f" && echo "下载 $f：正常" || { ok=""; echo "从书库下载的 $f 不对"; }
          done
          docker logs shuku-test 2>&1 | tail -n 20 | tee -a "$RUNNER_TEMP/build.log"
          docker rm -f shuku-test > /dev/null
          # Calibre：把一个 RTF 转成 EPUB（和书库转换时的参数一样）
          mkdir -p "$RUNNER_TEMP/conv"
          printf '%s\n' '{\rtf1\ansi\deff0{\fonttbl{\f0 Times;}}\f0\pard Shuku test {\b bold}.\par Second paragraph.\par}' > "$RUNNER_TEMP/conv/t.rtf"
          if docker run --rm --network none -v "$RUNNER_TEMP/conv:/t" --entrypoint ebook-convert "$IMAGE:latest" \
              /t/t.rtf /t/t.epub --no-default-epub-cover > "$RUNNER_TEMP/conv/log.txt" 2>&1 && [ -s "$RUNNER_TEMP/conv/t.epub" ]; then
            echo "Calibre：正常"
          else
            ok=""; echo "Calibre 转换失败"; tail -n 30 "$RUNNER_TEMP/conv/log.txt" | tee -a "$RUNNER_TEMP/build.log"
          fi
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          if [ -z "$ok" ]; then echo "::error::服务器镜像试运行没通过"; exit 1; fi
          cp docker-compose.yml dist/shuku-compose.yml

      - name: 从上一版升级试运行（书、进度、笔记、读完状态、登录都要还在）
        run: |
          set -o pipefail
          if ! docker image inspect shuku-prev:latest > /dev/null 2>&1; then echo "没有上一版镜像，跳过"; exit 0; fi
          U="$RUNNER_TEMP/upgrade"
          mkdir -p "$U/data" "$U/inbox" "$U/books" "$U/comics"
          start() {
            docker run -d --name "$1" --network host -e SHUKU_PORT=18081 \
              -v "$U/data:/data" -v "$U/inbox:/inbox" -v "$U/books:/books" -v "$U/comics:/comics" "$2" > /dev/null
            for i in $(seq 1 90); do
              curl -fsS http://127.0.0.1:18081/api/ping > /dev/null 2>&1 && return 0
              sleep 1
            done
            docker logs "$1" 2>&1 | tail -n 40 | tee -a "$RUNNER_TEMP/build.log"
            echo "::error::$1 没有启动起来"
            return 1
          }
          cat > "$RUNNER_TEMP/req.py" <<'EOF'
          import json, urllib.parse, urllib.request
          B = "http://127.0.0.1:18081"
          def req(method, path, body=None, tok="", raw=None):
              data = raw if raw is not None else (json.dumps(body).encode() if body is not None else None)
              r = urllib.request.Request(B + path, data=data, method=method)
              if tok:
                  r.add_header("Authorization", "Bearer " + tok)
              if body is not None:
                  r.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.loads(resp.read() or b"null")
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/req.py"
          # 上一版：设密码、放一本书、记进度和笔记、标成读完
          start shuku-old shuku-prev:latest
          PYTHONPATH="$RUNNER_TEMP" python3 - "$U" <<'EOF' 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          import json, sys, time, urllib.parse
          from req import req
          tok = req("POST", "/api/auth/setup", {"Password": "upgrade-test-1", "Device": "ci"})["token"]
          text = ("第一章 开始\n" + "这是一本用来测试升级的书。" * 300 + "\n第二章 继续\n" + "第二章的内容。" * 300).encode()
          req("POST", "/api/upload?path=" + urllib.parse.quote("升级测试 - 测试作者.txt"), raw=text, tok=tok)
          for i in range(90):
              books = req("GET", "/api/books", tok=tok)
              if books["total"] >= 1:
                  break
              time.sleep(1)
          assert books["total"] == 1, books
          bid = books["items"][0]["id"]
          req("PUT", f"/api/books/{bid}/progress", {"location": "sec:1", "percent": 0.42, "device": "ci", "seconds": 120}, tok=tok)
          req("POST", f"/api/books/{bid}/bookmarks", {"location": "sec:1", "label": "第二章", "text": "原文", "note": "升级测试笔记"}, tok=tok)
          req("PATCH", f"/api/books/{bid}", {"read_state": "done"}, tok=tok)
          json.dump({"tok": tok, "id": bid}, open(sys.argv[1] + "/state.json", "w"))
          print("上一版：已放入《升级测试》，记了进度、笔记、读完")
          EOF
          docker stop -t 20 shuku-old > /dev/null && docker rm shuku-old > /dev/null
          # 这一版：同一个数据目录启动，自动升级数据库
          start shuku-new "$IMAGE:latest"
          # 这一版改了数据库结构才会升级、才有“升级前的备份”（没改结构的版本没有）
          if docker logs shuku-new 2>&1 | grep -q "数据库已升级到第"; then export MIGRATED=1; else export MIGRATED=0; fi
          PYTHONPATH="$RUNNER_TEMP" python3 - "$U" <<'EOF' 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          import json, os, sys
          from req import req
          st = json.load(open(sys.argv[1] + "/state.json"))
          tok, bid = st["tok"], st["id"]
          books = req("GET", "/api/books", tok=tok)  # 原来登录的设备不用重新登录
          assert books["total"] == 1 and books["items"][0]["id"] == bid, books
          pr = req("GET", f"/api/books/{bid}/progress", tok=tok)
          assert pr["location"] == "sec:1", pr
          bm = req("GET", f"/api/books/{bid}/bookmarks", tok=tok)
          assert len(bm) == 1 and bm[0]["note"] == "升级测试笔记", bm
          b = req("GET", f"/api/books/{bid}", tok=tok)
          assert b["read_state"] == "done", b["read_state"]
          assert req("GET", "/api/me", tok=tok)["role"] == "admin"
          assert req("POST", "/api/auth/login", {"Password": "upgrade-test-1", "Device": "ci2"})["token"]
          bk = req("GET", "/api/backups", tok=tok)["backups"]
          if os.environ.get("MIGRATED") == "1":
              assert any(x["kind"] == "upgrade" for x in bk), bk
          print("从上一版升级：书、进度、笔记、读完状态、登录都在；" + ("升级前的备份：" + str([x["name"] for x in bk if x["kind"] == "upgrade"]) if os.environ.get("MIGRATED") == "1" else "这一版没有改数据库结构"))
          EOF
          docker logs shuku-new 2>&1 | grep -E "数据库|备份|启动|全文索引" | tail -n 20
          docker rm -f shuku-new > /dev/null

      - name: 推送镜像到 ghcr.io（NAS 上的更新服务从这里取新版本）
        run: |
          docker push "$IMAGE:v$V"
          docker push "$IMAGE:latest"

      - name: NAS 本地语音服务 shuku-tts（tts 文件夹没改就用做好的）
        run: |
          set -o pipefail
          # 标签按 tts 文件夹的内容算：没改就不重做，NAS 也不用重新下载（安装：deploy/tts/install.sh）
          T=ghcr.io/smallyjh-boop/shuku-tts
          tag=$(cat tts/Dockerfile tts/server.py | sha256sum | cut -c1-12)
          if docker buildx imagetools inspect "$T:$tag" > /dev/null 2>&1; then
            echo "用已有的 $T:$tag"
            exit 0
          fi
          docker buildx build --platform linux/amd64 --build-arg TTS_VERSION="$tag" -t "$T:$tag" -t "$T:latest" --load tts 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          # 试运行：启动、合成一句中英混读，拿到 MP3 才推送
          docker run -d --name tts-check --network host -e TTS_PORT=27299 "$T:$tag"
          ok=
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:27299/health && ok=1 && break; sleep 2; done
          [ -n "$ok" ] || { docker logs tts-check; exit 1; }
          curl -fs -X POST -H 'Content-Type: application/json' -d '{"input":"那是一个晴朗的早晨。It was a bright cold day.","speed":1}' \
            http://127.0.0.1:27299/v1/audio/speech -o "$RUNNER_TEMP/tts.mp3"
          size=$(stat -c%s "$RUNNER_TEMP/tts.mp3"); echo "试读：$size 字节"; [ "$size" -gt 5000 ]
          docker logs tts-check | tail -n 3
          docker rm -f tts-check > /dev/null
          docker push "$T:$tag"
          docker push "$T:latest"

      # ---------- 出错时 ----------

      - name: 打包出错时把出错的地方写进注释
        if: failure()
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          { grep -E "^e: |error:|ERROR|What went wrong|Could not|FAILURE" -A6 "$f" | head -n 120; echo "------ 最后 40 行 ------"; tail -n 40 "$f"; } > "$RUNNER_TEMP/err.txt"
          echo "::error title=打包出错::$(sed -e 's/%/%25/g' -e 's/\r//g' "$RUNNER_TEMP/err.txt" | awk '{printf "%s%%0A", $0}')"

      # ---------- 发布 ----------

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt
          ls -l
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          NAS 上的书库会在一分钟内自动升级到这个版本（镜像 ghcr.io/smallyjh-boop/shuku:latest）；
          手机 App 打开时会提示更新，手表和浏览器插件会提示有新版本。

          - shuku-android.apk：安卓手机 App（Android 8.0 及以上）
          - shuku-wear.apk：Wear OS 手表 App（Wear OS 3 及以上；手机 App 里“更新手表”会下载好交给 Wear OS 工具箱）
          - shuku-extension.zip：Chrome / Edge 浏览器插件（解压后“加载已解压的扩展程序”）
          - shuku-compose.yml：第一次安装服务器时在 Container Station 里粘贴的配置

          SHA256SUMS.txt 是校验值。安装方法见 README。
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          # 这次更新了什么：CHANGES.md 最上面那一节
          awk '/^## /{n++} n==1' "$GITHUB_WORKSPACE/CHANGES.md" 2>/dev/null | tail -n +2 > "$RUNNER_TEMP/changes.md" || true
          if [ -s "$RUNNER_TEMP/changes.md" ]; then
            { echo; echo "### 这次更新"; cat "$RUNNER_TEMP/changes.md"; } >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "v$V" * --title "书库 $V" --target "${{ github.sha }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: ghcr.io 上只留最近 10 个版本（省存储；新版本有问题时可以退回旧版本）
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: shuku
          package-type: container
          min-versions-to-keep: 10
