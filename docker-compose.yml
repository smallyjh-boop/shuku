# 书库 Shuku —— 威联通 Container Station 用
#
# 1. 先在 Container Station →“映像”→“导入”里导入镜像文件（Releases 里下载）：
#      Intel / AMD 处理器的 NAS 用 shuku-server-amd64.tar.gz，ARM 处理器的用 shuku-server-arm64.tar.gz
# 2. Container Station →“应用程序”→“创建”（旧版是“创建”→“创建应用程序”），名称填 shuku，把这整个文件粘贴进去 →“创建”
#
# 下面 volumes 里冒号左边是 NAS 上的文件夹，按你的实际共享文件夹改（要先在控制台里建好共享文件夹）；
# 冒号右边是容器里的路径，不要改。
# 自己从源码构建（SSH）：docker build -t localhost/shuku:latest . && docker compose up -d

services:
  shuku:
    image: localhost/shuku:latest
    container_name: shuku
    restart: unless-stopped
    ports:
      # 浏览器打开 http://NAS的IP:8090。威联通系统自己的管理页面占用 8080，所以左边不要用 8080
      - "8090:8080"
    environment:
      # 时区，影响“今天读了多久”等统计。在中国用 Asia/Shanghai
      - TZ=Asia/Bangkok
      # 书库目录：名称:容器内路径:类型（book 图书 / comic 漫画）。只在第一次启动时生效，之后在网页“设置 → 书库目录”里改
      - SHUKU_LIBRARIES=图书:/books:book,漫画:/comics:comic
      # 内网地址、Tailscale 地址、AI 识别都在装好后的网页“设置”里填，这里不用改
    volumes:
      - /share/Container/shuku:/data          # 数据库、封面、缓存
      - /share/Books/投递:/inbox                # 投递目录：把书丢进来自动入库
      - /share/Books/图书:/books                # 整理好的电子书
      - /share/Books/漫画:/comics               # 整理好的漫画
