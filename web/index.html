<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F8F6" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="书库">
<title>书库</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  // 在页面绘制前确定深浅色，避免夜里打开时闪一下白屏
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('shuku.app') || '{}')
      var mode = p.appearance || 'system'
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (localStorage.getItem('shuku.night') === '1') dark = true
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    } catch (e) {}
  })()
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
