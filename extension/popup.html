<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>书库</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="bar">
    <img class="mark" src="icons/32.png" alt="">
    <div class="who"><b>书库</b><span id="server"></span></div>
    <span id="route" class="route">连接中…</span>
    <button id="open" class="icon-btn" type="button" title="打开书库网页" aria-label="打开书库网页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg>
    </button>
    <button id="settings" class="icon-btn" type="button" title="插件设置" aria-label="插件设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="scroll">
    <div id="main"></div>
    <section id="tasks" class="tasks" hidden>
      <div class="tasks-head"><span>加入记录</span><button id="clear" class="link muted" type="button">清除已结束的</button></div>
      <ul id="task-list"></ul>
    </section>
  </div>
  <footer id="action" class="action" hidden>
    <button id="add" class="btn primary wide" type="button">加入书库</button>
    <div id="add-hint" class="hint"></div>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
